# Standard Laravel Nginx site — document root MUST be .../public
# Certbot will add listen 443 ssl after certificate issuance. Do not add HTTPS here yet.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name portal.munch.co.ke 164.90.229.92;

    root /var/www/portal.munch.co.ke/public;
    index index.php;

    charset utf-8;
    server_tokens off;
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # eFood still emits cPanel-era URLs: /public/assets/...
    # Rewrite onto this public/ document root without serving the project root.
    location /public/ {
        rewrite ^/public/(.*)$ /$1 last;
    }

    # Uploaded media URLs are asset('storage/app/public/...') — not /storage/...
    # ^~ wins over regex .php so uploaded PHP cannot be executed.
    location ^~ /storage/app/public/ {
        alias /var/www/portal.munch.co.ke/storage/app/public/;
        expires 7d;
        access_log off;
        location ~* \.php$ { deny all; }
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(env|log|htaccess)$ {
        deny all;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    access_log /var/log/nginx/portal.munch.co.ke.access.log;
    error_log  /var/log/nginx/portal.munch.co.ke.error.log;
}
