# Ops note: long-cache + gzip for versioned static assets (?v= cache-bust).
# Include from the portal vhost or merge into portal.munch.co.ke.conf, then:
#   nginx -t && systemctl reload nginx
# Do not apply blindly on HostAfrica / app.munch.co.ke.

location ^~ /assets/admin/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
    try_files $uri =404;
}

location ^~ /public/assets/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    access_log off;
}

# Recommend in http {} (host-level; not duplicated per-site):
# gzip on;
