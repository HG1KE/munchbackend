# Ops note (Meatco Perf D): long-cache + gzip for admin static assets.
# Include from the portal vhost or merge into portal.munch.co.ke.conf, then:
#   nginx -t && systemctl reload nginx
# Do not apply blindly on HostAfrica / app.munch.co.ke.

location ^~ /assets/admin/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
    try_files $uri =404;
}

location ^~ /public/assets/admin/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
    # eFood-era /public/assets/... URLs are rewritten by the main vhost;
    # keep this block for direct asset paths after rewrite.
    try_files $uri =404;
}

